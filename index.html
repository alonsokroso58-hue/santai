    const vendorDataMap = new Map();

    function parseCSV(text) {
        let lines = text.split("\n");
        let result = [];
        for (let i = 0; i < lines.length; i++) {
            let currentLine = lines[i].trim();
            if (!currentLine) continue;
            
            let row = [];
            let inQuotes = false;
            let entry = '';
            
            for (let j = 0; j < currentLine.length; j++) {
                let char = currentLine[j];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(entry);
                    entry = '';
                } else {
                    entry += char;
                }
            }
            row.push(entry);
            result.push(row);
        }
        return result;
    }

    async function syncVendorSheet(showAlert = false) {
        const csvUrl = "https://script.google.com/macros/s/AKfycbx5HOgLUB76aBdSLr_V9k_uUBH-ro57TPGZ6JwT2aEtuBqX6u2iUVbTfwRYVv1dHhEJQQ/exec";
        
        const statusBar = document.getElementById('statusBar');
        const errorMsg = document.getElementById('errorMsg');

        statusBar.className = 'status-bar status-loading';
        statusBar.style.display = 'block';
        statusBar.innerText = 'Mengambil data terbaru dari Sheet Vendor...';
        errorMsg.style.display = 'none';

        try {
            const response = await fetch(csvUrl + (csvUrl.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime(), { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const csvText = await response.text();
            const rows = parseCSV(csvText);
            vendorDataMap.clear();

            let matchedCount = 0;
            for (let i = 0; i < rows.length; i++) {
                const cols = rows[i];
                if (!cols || cols.length === 0) continue;
                
                let foundReff = '';
                let status = 'Unknown';
                let note = '-';

                for (let c = 0; c < cols.length; c++) {
                    const val = cols[c] ? cols[c].trim().replace(/^"|"$/g, '') : '';
                    if (!val) continue;
                    
                    const cleanVal = val.toUpperCase().replace(/[^A-Z0-9_]/g, '');
                    if (cleanVal.length > 40) continue; 

                    if (cleanVal.length >= 8 && /\d/.test(cleanVal) && /[A-Z]/.test(cleanVal)) {
                        if (!['DISBURSE', 'PROJECT', 'MERCHANT', 'PAYMENT', 'STATUS', 'NOTE', 'SUCCESS', 'FAILED', 'PENDING', 'GAGAL', 'SUKSES', 'REF'].includes(cleanVal)) {
                            if (!foundReff) foundReff = cleanVal;
                        }
                    }

                    const valLower = val.toLowerCase();
                    if (['failed', 'success', 'pending', 'suspect', 'gagal', 'sukses', 'error', 'batal', 'completed', 'settled'].some(s => valLower === s || valLower.includes(s))) {
                        status = val;
                    }
                }

                if (foundReff && status !== 'Unknown') {
                    vendorDataMap.set(foundReff, { status, note });
                    if (foundReff.startsWith('TF_')) {
                        vendorDataMap.set(foundReff.replace(/^TF_/, ''), { status, note });
                    }
                    matchedCount++;
                }
            }

            statusBar.className = 'status-bar status-success';
            statusBar.innerText = `Sinkronisasi Berhasil: ${matchedCount} data referensi terbaru dimuat secara real-time.`;
        } catch (err) {
            statusBar.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.innerText = 'Gagal menyinkronkan data dari vendor. Periksa koneksi internet Anda.';
            console.error("Error Fetching Sheet:", err);
        }
    }

    async function checkStatusBulk() {
        const rawInput = document.getElementById('refInput').value.trim();
        const resultsContainer = document.getElementById('resultsContainer');
        
        if (!rawInput) {
            alert('Silakan masukkan minimal satu nomor referensi!');
            return;
        }

        await syncVendorSheet(false);

        const lines = rawInput.split('\n');
        const groups = {};

        lines.forEach(line => {
            const refInput = line.trim();
            if (!refInput) return;

            const cleanInput = refInput.toUpperCase().replace(/[^A-Z0-9_]/g, '');
            const data = vendorDataMap.get(cleanInput) || vendorDataMap.get('TF_' + cleanInput);

            let categoryKey = 'Lainnya';
            let matchedUrl = '';
            for (const [code, url] of Object.entries(siteLinks)) {
                if (cleanInput.includes(code)) {
                    categoryKey = code;
                    matchedUrl = url;
                    break;
                }
            }

            if (!groups[categoryKey]) {
                groups[categoryKey] = {
                    url: matchedUrl,
                    items: []
                };
            }

            const statusStr = data ? data.status : 'Tidak Ditemukan';
            const isFailed = /failed|gagal|error|batal/i.test(statusStr);

            groups[categoryKey].items.push({
                ref: refInput,
                status: statusStr,
                isFailed: isFailed
            });
        });

        resultsContainer.innerHTML = '';
        for (const [catCode, groupData] of Object.entries(groups)) {
            const count = groupData.items.length;
            const titleText = catCode === 'Lainnya' ? 'Lainnya / Tidak Dikenali' : `Kode Kategori: ${catCode} (${count} transaksi)`;
            
            const allRefsString = groupData.items.map(i => i.ref).join('\n');

            let sectionHtml = `
                <div class="group-section">
                    <div>
                        <div class="group-header-row">
                            <span class="group-title">${titleText}</span>
                            <button class="btn-action btn-copy-all" onclick="copyTextData(decodeURIComponent('${encodeURIComponent(allRefsString)}'))">Salin Semua Reff</button>
                        </div>
                        <div class="scrollable-list">
            `;

            groupData.items.forEach(item => {
                const rowClass = item.isFailed ? 'ref-row status-failed' : 'ref-row status-success';
                sectionHtml += `
                    <div class="${rowClass}">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;" title="${item.ref}">${item.ref}</span>
                        <div>
                            <span class="status-label">Status: ${item.status}</span>
                            <button class="btn-action btn-copy" onclick="copyTextData('${item.ref}')">Salin</button>
                        </div>
                    </div>
                `;
            });

            sectionHtml += `</div></div>`;

            if (groupData.url) {
                sectionHtml += `
                    <div class="link-box">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;" title="${groupData.url}">${groupData.url}</span>
                        <div>
                            <button class="btn-action btn-copy" onclick="copyTextData('${groupData.url}')">Salin Link</button>
                            <a href="${groupData.url}" target="_blank" class="btn-action btn-web">Buka Web</a>
                        </div>
                    </div>
                `;
            }

            sectionHtml += `</div>`;
            resultsContainer.innerHTML += sectionHtml;
        }
    }

    function copyTextData(text) {
        navigator.clipboard.writeText(text).catch(err => {
            console.error('Gagal menyalin: ', err);
        });
